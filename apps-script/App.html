<script>
/* =====================================================================
 *  Client app – ระบบปรับลดราคา BOQ ตาม ว 651
 * ===================================================================== */
var E = BoqEngine, F = E.fmt;
var S = { user: '', settings: {}, projects: [], cur: null, dirty: false, res: null, tab: 'dash' };

/* ---------------------- API bridge (Apps Script / local demo) ---------------------- */
var IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
function api(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  if (IS_GAS) {
    return new Promise(function (ok, bad) {
      var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { bad(e && e.message ? e : new Error(String(e))); });
      r[fn].apply(r, args);
    });
  }
  return new Promise(function (ok, bad) { setTimeout(function () { try { ok(LocalApi[fn].apply(null, args)); } catch (e) { bad(e); } }, 120); });
}

/* Local demo backend (ใช้เมื่อเปิดไฟล์นอก Apps Script เท่านั้น) */
var LocalApi = (function () {
  var mem = null, KEY = 'boq651_demo_v1';
  function load() {
    if (mem) return mem;
    try { mem = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { mem = null; }
    if (!mem) {
      mem = { settings: { orgName: 'สำนักงานการปฏิรูปที่ดินเพื่อเกษตรกรรมจังหวัดจันทบุรี', orgShort: 'ส.ป.ก.จันทบุรี', officerName: '', officerPosition: '', checkerName: '', checkerPosition: '', headName: '', headPosition: 'ปฏิรูปที่ดินจังหวัดจันทบุรี' }, projects: {} };
      ['building', 'south', 'road'].forEach(function (k, i) {
        var d = BOQ_SAMPLES[k](); d.project.id = 'DEMO' + (i + 1);
        d.items.forEach(function (it, j) { it.id = 'd' + i + '_' + j; });
        d.project.updatedAt = '2568-09-2' + (6 - i) + ' 10:0' + i; mem.projects[d.project.id] = d;
      });
    }
    return mem;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { /* storage blocked – keep in memory */ } }
  function list() {
    var m = load();
    return Object.keys(m.projects).map(function (id) {
      var d = m.projects[id], p = d.project, r = E.compute(p, p.sections, d.items);
      return { id: id, name: p.name, workType: p.workType, projectNo: p.projectNo, agency: p.agency, budget: +p.budget || 0, offer: +p.offer || 0,
        contractor: p.contractor, contractNo: p.contractNo, status: p.status, midPrice: r.total, contractPrice: r.sumAdj, pct: r.pct, updatedAt: p.updatedAt || '', updatedBy: 'demo' };
    }).sort(function (a, b) { return String(b.updatedAt).localeCompare(String(a.updatedAt)); });
  }
  function now() { var d = new Date(); return (d.getFullYear() + 543) + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2) + ' ' + d.toTimeString().slice(0, 5); }
  return {
    apiInit: function () { var m = load(); return { user: 'โหมดออฟไลน์ · ข้อมูลอยู่ในเครื่องนี้', settings: m.settings, projects: list(), dbUrl: '', version: (window.APP_VERSION || '1.0.0') + ' (PWA)' }; },
    apiExportAll: function () { var m = load(); return { app: 'boq-w651', format: 1, exportedAt: new Date().toISOString(), settings: m.settings, projects: m.projects }; },
    apiImportAll: function (d) {
      if (!d || d.app !== 'boq-w651' || typeof d.projects !== 'object') throw new Error('ไฟล์นี้ไม่ใช่ไฟล์สำรองของระบบปรับลดราคา BOQ');
      mem = { settings: d.settings || load().settings, projects: d.projects }; save(); return list();
    },
    apiResetAll: function () { var s = load().settings; mem = { settings: s, projects: {} }; save(); return list(); },
    apiListProjects: list,
    apiGetProject: function (id) { return JSON.parse(JSON.stringify(load().projects[id])); },
    apiSaveProject: function (d) {
      var m = load(); d = JSON.parse(JSON.stringify(d));
      if (!d.project.id) d.project.id = 'L' + Date.now();
      d.project.updatedAt = now(); m.projects[d.project.id] = d; save();
      return { id: d.project.id, projects: list(), updatedAt: d.project.updatedAt };
    },
    apiDeleteProject: function (id) { var m = load(); delete m.projects[id]; save(); return list(); },
    apiDuplicateProject: function (id) {
      var d = JSON.parse(JSON.stringify(load().projects[id])); d.project.id = ''; d.project.name += ' (สำเนา)'; d.project.contractNo = '';
      return LocalApi.apiSaveProject(d);
    },
    apiSaveSettings: function (s) { var m = load(); Object.assign(m.settings, s); save(); return m.settings; },
    apiExportReport: function () { throw new Error('การส่งออกไป Google Drive ใช้ได้เมื่อติดตั้งบน Google Apps Script เท่านั้น — ในโหมดสาธิตให้ใช้ปุ่ม "พิมพ์ / บันทึก PDF"'); }
  };
})();

/* ---------------------- UI helpers ---------------------- */
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function num(v) { if (v === '' || v === null || v === undefined) return ''; var n = Number(String(v).replace(/,/g, '')); return isNaN(n) ? '' : n; }
function uid() { return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function loading(on) { $('#loader').classList.toggle('hide', !on); }
function toast(msg, type) {
  var el = document.createElement('div');
  el.className = 'toast align-items-center text-bg-' + (type || 'success') + ' border-0';
  el.innerHTML = '<div class="d-flex"><div class="toast-body">' + msg + '</div><button class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>';
  $('#toasts').appendChild(el); var t = new bootstrap.Toast(el, { delay: 3200 }); t.show();
  el.addEventListener('hidden.bs.toast', function () { el.remove(); });
}
function fail(e) { loading(false); Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: e && e.message ? e.message : String(e), confirmButtonColor: '#16603f' }); }
function confirmBox(title, text, danger) {
  return Swal.fire({ icon: danger ? 'warning' : 'question', title: title, text: text, showCancelButton: true, confirmButtonText: 'ยืนยัน', cancelButtonText: 'ยกเลิก', confirmButtonColor: danger ? '#b02a37' : '#16603f' }).then(function (r) { return r.isConfirmed; });
}
function kindLabel(k) { return { construction: 'งานก่อสร้าง (Factor F)', equipment: 'ครุภัณฑ์จัดซื้อ (VAT)', special: 'ค่าใช้จ่ายพิเศษตามข้อกำหนด' }[k] || k; }

/* ---------------------- Tabs ---------------------- */
function showTab(t) {
  if ((t === 'calc' || t === 'report') && !S.cur) { toast('กรุณาเลือกหรือสร้างโครงการก่อน', 'warning'); t = 'dash'; }
  S.tab = t;
  $$('#mainNav .nav-link').forEach(function (a) { a.classList.toggle('active', a.getAttribute('data-tab') === t); });
  $$('.tab-pane-x').forEach(function (s) { s.classList.toggle('d-none', s.id !== 'tab-' + t); });
  if (t === 'dash') renderDash();
  if (t === 'calc') renderCalc();
  if (t === 'report') renderReport();
  if (t === 'settings') renderSettings();
  window.scrollTo(0, 0);
}

/* ---------------------- Init ---------------------- */
document.addEventListener('DOMContentLoaded', function () {
  bindStatic();
  api('apiInit').then(function (d) {
    S.user = d.user; S.settings = d.settings; S.projects = d.projects; S.dbUrl = d.dbUrl; S.version = d.version;
    $('#userEmail').textContent = d.user; 
    loading(false); showTab('dash');
    if (location.hash === '#new') { newProject(); try { history.replaceState(null, '', location.pathname); } catch (e) { /* ignore */ } }
    $$('.gas-only').forEach(function (el) { el.classList.toggle('d-none', !IS_GAS); });
    $$('.local-only').forEach(function (el) { el.classList.toggle('d-none', IS_GAS); });
    if (!IS_GAS) { var seen = false; try { seen = localStorage.getItem('boq651_hint') === '1'; localStorage.setItem('boq651_hint', '1'); } catch (e) { /* ignore */ }
      if (!seen) toast('โหมดออฟไลน์: ข้อมูลเก็บในเครื่องนี้ — สำรองข้อมูลได้ที่แท็บ "ตั้งค่า"', 'info'); }
  }).catch(fail);
});
window.addEventListener('beforeunload', function (e) { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });

function bindStatic() {
  $$('#mainNav .nav-link').forEach(function (a) { a.addEventListener('click', function () { showTab(a.getAttribute('data-tab')); }); });
  document.addEventListener('click', function (e) {
    var g = e.target.closest('[data-go]'); if (g) showTab(g.getAttribute('data-go'));
    var smp = e.target.closest('[data-sample]'); if (smp) loadSample(smp.getAttribute('data-sample'));
  });
  $('#btnNew').addEventListener('click', newProject);
  $('#q').addEventListener('input', renderProjRows);
  $('#btnSave').addEventListener('click', saveProject);
  $('#btnAddSec').addEventListener('click', addSection);
  $$('[data-add]').forEach(function (b) { b.addEventListener('click', function () { addRow(b.getAttribute('data-add')); }); });
  $('#btnPaste').addEventListener('click', openPaste);
  $('#btnDoPaste').addEventListener('click', doPaste);
  $('#pasteText').addEventListener('input', previewPaste);
  $('#btnClearItems').addEventListener('click', function () {
    confirmBox('ล้างรายการ BOQ ทั้งหมด?', 'รายการทั้งหมดของโครงการนี้จะถูกลบ (ยังไม่บันทึกจนกว่าจะกดบันทึก)', true).then(function (ok) {
      if (ok) { S.cur.items = []; markDirty(); renderBoq(); }
    });
  });
  // project form
  $$('#projForm [data-f]').forEach(function (el) {
    el.addEventListener('input', function () {
      var k = el.getAttribute('data-f'), v = el.value;
      if (el.classList.contains('num')) v = num(v);
      S.cur.project[k] = v;
      if (k === 'markupPct') $('#chkSouth').checked = !!Number(v);
      if (k === 'name') $('#editTitle').textContent = v || 'โครงการใหม่';
      markDirty(); refreshLive();
    });
    if (el.classList.contains('num')) el.addEventListener('blur', function () { if (el.value !== '' && num(el.value) !== '') el.value = F(num(el.value), el.getAttribute('data-f') === 'markupPct' ? 2 : 2); });
  });
  $('#chkSouth').addEventListener('change', function () {
    S.cur.project.markupPct = this.checked ? 5 : 0; $('[data-f=markupPct]').value = this.checked ? '5.00' : '';
    markDirty(); refreshLive();
  });
  // sections (delegation)
  $('#secRows').addEventListener('input', function (e) {
    var tr = e.target.closest('tr'); if (!tr) return;
    var s = S.cur.project.sections[Number(tr.getAttribute('data-i'))], k = e.target.getAttribute('data-k');
    s[k] = k === 'factor' ? num(e.target.value) : e.target.value;
    if (k === 'kind' && e.target.value === 'special') { s.factor = 1; tr.querySelector('[data-k=factor]').value = '1.0000'; }
    markDirty(); if (k === 'name' || k === 'kind') renderBoq(); else { updateBoqCalcCells(); refreshLive(); }
  });
  $('#secRows').addEventListener('click', function (e) {
    var b = e.target.closest('[data-del-sec]'); if (!b) return;
    var i = Number(b.getAttribute('data-del-sec')), s = S.cur.project.sections[i];
    var n = S.cur.items.filter(function (it) { return it.section === s.code; }).length;
    confirmBox('ลบหมวด "' + s.name + '"?', n ? 'มีรายการในหมวดนี้ ' + n + ' รายการ จะถูกลบด้วย' : '', true).then(function (ok) {
      if (!ok) return;
      S.cur.project.sections.splice(i, 1);
      S.cur.items = S.cur.items.filter(function (it) { return it.section !== s.code; });
      markDirty(); renderSections(); renderBoq();
    });
  });
  // BOQ (delegation)
  var boq = $('#boqRows');
  boq.addEventListener('input', onBoqInput);
  boq.addEventListener('change', function (e) { if (e.target.matches('select')) onBoqInput(e, true); });
  boq.addEventListener('focusout', function (e) {
    var el = e.target; if (!el.classList.contains('num')) return;
    var v = num(el.value); if (v !== '') el.value = F(v, el.getAttribute('data-k') === 'qty' ? (Math.round(v) === v ? 2 : 3) : 2);
  });
  boq.addEventListener('click', onBoqClick);
  boq.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || !e.target.matches('input')) return;
    e.preventDefault();
    var tr = e.target.closest('tr'), k = e.target.getAttribute('data-k');
    var next = tr.nextElementSibling;
    if (!next) { addRow('ITEM'); next = $('#boqRows').lastElementChild; }
    var t = next.querySelector('[data-k=' + k + ']') || next.querySelector('[data-k=name]'); if (t) t.focus();
  });
  // report
  $$('#formPick input, #optSign, #optSample').forEach(function (el) { el.addEventListener('change', renderReport); });
  $('#btnPrint').addEventListener('click', function () { if (S.dirty) toast('หมายเหตุ: ข้อมูลยังไม่ได้บันทึก', 'warning'); window.print(); });
  $('#btnExportSheet').addEventListener('click', function () { exportReport(false); });
  $('#btnExportPdf').addEventListener('click', function () { exportReport(true); });
  $('#btnSaveSet').addEventListener('click', saveSettings);
  $('#btnBackup').addEventListener('click', backupLocal);
  $('#fileRestore').addEventListener('change', restoreLocal);
  $('#btnResetLocal').addEventListener('click', resetLocal);
  setupInstall();
}

/* ---------------------- Dashboard ---------------------- */
function renderDash() {
  var P = S.projects, mid = 0, con = 0, n = P.length, done = 0;
  P.forEach(function (p) { mid += +p.midPrice || 0; con += +p.contractPrice || 0; if (p.status === 'ปรับลดแล้ว' || p.status === 'ลงนามสัญญาแล้ว') done++; });
  var diff = mid - con;
  $('#kpis').innerHTML = [
    kpi('accent', 'bi-folder2', 'จำนวนโครงการ', n.toLocaleString('th-TH'), 'ปรับลดแล้ว/ลงนาม ' + done + ' โครงการ'),
    kpi('', 'bi-cash-stack', 'ราคากลางรวม (บาท)', F(mid), 'รวมค่าใช้จ่ายพิเศษ'),
    kpi('', 'bi-file-earmark-check', 'วงเงินตามสัญญารวม (บาท)', F(con), 'ราคาที่ปรับลดตามคำเสนอ'),
    kpi('', 'bi-graph-down-arrow', 'ส่วนต่างจากราคากลาง (บาท)', F(diff), mid ? 'คิดเป็น ' + F(diff / mid * 100) + '% ของราคากลาง' : '-')
  ].join('');
  renderProjRows();
}
function kpi(cls, ico, lbl, val, sub) {
  return '<div class="col-sm-6 col-lg-3"><div class="kpi ' + cls + '"><i class="bi ' + ico + ' ico"></i><div class="lbl">' + lbl + '</div><div class="val">' + val + '</div><div class="sub">' + sub + '</div></div></div>';
}
function statusBadge(s) {
  var c = { 'ร่าง': 'secondary', 'ปรับลดแล้ว': 'success', 'ลงนามสัญญาแล้ว': 'primary', 'ยกเลิก': 'danger' }[s] || 'secondary';
  return '<span class="badge rounded-pill text-bg-' + c + '">' + esc(s || 'ร่าง') + '</span>';
}
function renderProjRows() {
  var q = ($('#q').value || '').toLowerCase();
  var rows = S.projects.filter(function (p) { return !q || [p.name, p.projectNo, p.contractor, p.contractNo, p.agency].join(' ').toLowerCase().indexOf(q) >= 0; });
  if (!rows.length) {
    $('#projRows').innerHTML = '<tr><td colspan="8"><div class="empty"><i class="bi bi-inboxes"></i>' + (S.projects.length ? 'ไม่พบโครงการที่ค้นหา' : 'ยังไม่มีโครงการ — กด "สร้างโครงการใหม่" หรือโหลด "ตัวอย่าง ว 651"') + '</div></td></tr>';
    return;
  }
  $('#projRows').innerHTML = rows.map(function (p) {
    return '<tr><td><div class="proj-name">' + esc(p.name || '(ไม่มีชื่อ)') + '</div><div class="proj-meta">' +
      (p.projectNo ? 'เลขที่โครงการ ' + esc(p.projectNo) + ' · ' : '') + esc(p.contractor || '') + (p.contractNo ? ' · สัญญา ' + esc(p.contractNo) : '') + '</div></td>' +
      '<td class="text-end">' + F(p.budget) + '</td><td class="text-end">' + F(p.midPrice) + '</td><td class="text-end fw-semibold">' + F(p.contractPrice) + '</td>' +
      '<td class="text-end">' + (p.pct === '' || p.pct === undefined ? '-' : F(p.pct)) + '</td><td>' + statusBadge(p.status) + '</td>' +
      '<td class="small text-muted">' + esc(p.updatedAt || '') + '</td>' +
      '<td class="text-end text-nowrap"><div class="btn-group btn-group-sm">' +
      '<button class="btn btn-outline-success" title="เปิด/แก้ไข" onclick="openProject(\'' + p.id + '\')"><i class="bi bi-pencil"></i></button>' +
      '<button class="btn btn-outline-primary" title="รายงาน" onclick="openProject(\'' + p.id + '\',\'report\')"><i class="bi bi-printer"></i></button>' +
      '<button class="btn btn-outline-secondary" title="ทำสำเนา" onclick="dupProject(\'' + p.id + '\')"><i class="bi bi-copy"></i></button>' +
      '<button class="btn btn-outline-danger" title="ลบ" onclick="delProject(\'' + p.id + '\')"><i class="bi bi-trash"></i></button></div></td></tr>';
  }).join('');
}

/* ---------------------- Project lifecycle ---------------------- */
function defaultSections() {
  return [
    { code: '1', name: 'งานก่อสร้าง', kind: 'construction', factor: '' },
    { code: '2', name: 'งานครุภัณฑ์จัดซื้อ', kind: 'equipment', factor: 1.07 },
    { code: '3', name: 'ค่าใช้จ่ายพิเศษตามข้อกำหนด', kind: 'special', factor: 1 }
  ];
}
function guardDirty() { return S.dirty ? confirmBox('มีข้อมูลที่ยังไม่บันทึก', 'ต้องการละทิ้งการแก้ไขหรือไม่?', true) : Promise.resolve(true); }
function newProject() {
  guardDirty().then(function (ok) {
    if (!ok) return;
    S.cur = { project: { id: '', name: '', workType: 'อาคาร', projectNo: '', agency: S.settings.orgName || '', budget: '', offer: '', contractor: '', contractNo: '', contractDate: '', awardDate: '',
      markupPct: 0, method: 'std', pctMode: 'trunc', adjRound: 'trunc', residualId: '', sections: defaultSections(), caseInfo: {}, status: 'ร่าง', note: '' }, items: [] };
    S.dirty = false; openEditor();
  });
}
function loadSample(k) {
  guardDirty().then(function (ok) {
    if (!ok) return;
    var d = BOQ_SAMPLES[k](); d.project.id = ''; d.project.caseInfo = {};
    d.items.forEach(function (it) { it.id = uid(); });
    S.cur = d; S.dirty = true; openEditor(); markDirty();
    toast('โหลดตัวอย่างแล้ว — ตรวจสอบผลในแท็บ "ผลการปรับลดราคา" และกดบันทึกหากต้องการเก็บไว้', 'info');
  });
}
function openProject(id, tab) {
  guardDirty().then(function (ok) {
    if (!ok) return;
    loading(true);
    api('apiGetProject', id).then(function (d) {
      d.project.sections = (d.project.sections && d.project.sections.length) ? d.project.sections : defaultSections();
      d.project.caseInfo = d.project.caseInfo || {};
      d.items.forEach(function (it) { if (!it.id) it.id = uid(); });
      S.cur = d; S.dirty = false; loading(false); openEditor(tab);
    }).catch(fail);
  });
}
function dupProject(id) { loading(true); api('apiDuplicateProject', id).then(function (r) { S.projects = r.projects; loading(false); renderDash(); toast('ทำสำเนาโครงการแล้ว'); }).catch(fail); }
function delProject(id) {
  var p = S.projects.filter(function (x) { return x.id === id; })[0];
  confirmBox('ลบโครงการ?', (p ? p.name : id) + ' — ข้อมูลทั้งหมดจะถูกลบถาวร', true).then(function (ok) {
    if (!ok) return; loading(true);
    api('apiDeleteProject', id).then(function (list) { S.projects = list; if (S.cur && S.cur.project.id === id) { S.cur = null; S.dirty = false; } loading(false); renderDash(); toast('ลบโครงการแล้ว'); }).catch(fail);
  });
}
function validate() {
  var p = S.cur.project, errs = [];
  if (!String(p.name || '').trim()) errs.push('ชื่อโครงการ');
  if (!(num(p.offer) > 0)) errs.push('ราคาตามคำเสนอของผู้ชนะ');
  p.sections.forEach(function (s) { if (!(num(s.factor) > 0)) errs.push('Factor F ของหมวด "' + s.name + '"'); });
  return errs;
}
function saveProject() {
  var errs = validate();
  if (errs.length) { Swal.fire({ icon: 'warning', title: 'กรอกข้อมูลไม่ครบ', html: 'กรุณาระบุ:<br>• ' + errs.map(esc).join('<br>• '), confirmButtonColor: '#16603f' }); return; }
  loading(true);
  var payload = { project: S.cur.project, items: S.cur.items };
  api('apiSaveProject', payload).then(function (r) {
    S.cur.project.id = r.id; S.cur.project.updatedAt = r.updatedAt; S.projects = r.projects; S.dirty = false;
    $('#dirtyBadge').classList.add('d-none'); loading(false); toast('<i class="bi bi-check-circle"></i> บันทึกข้อมูลเรียบร้อย');
  }).catch(fail);
}
function markDirty() { S.dirty = true; $('#dirtyBadge').classList.remove('d-none'); }

/* ---------------------- Editor ---------------------- */
function openEditor(tab) {
  var p = S.cur.project;
  $('#editTitle').textContent = p.name || 'โครงการใหม่';
  $('#dirtyBadge').classList.toggle('d-none', !S.dirty);
  $$('#projForm [data-f]').forEach(function (el) {

    else { o.title = 'ปรับลดราคาได้ตามข้อ 1.2.2'; o.short = 'ราคาเสนอต่ำกว่าราคากลาง' + (budget ? 'และวงเงินที่จะจ้าง' : '') + ' → ปรับลดทุกรายการ แล้วลงนามสัญญา (ข้อ 1.2.3)'; }

    if (ci.nego === 'below') { o.level = 'warning'; o.title = 'ต่อรองแล้ว: ลดต่ำกว่าราคากลาง (ข้อ 1.2.4 (2.1))'; o.short = 'ให้แก้ไข "ราคาตามคำเสนอ" เป็นราคาหลังต่อรอง แล้วปรับลดตามข้อ 1.2.2'; }

/** แปลงผลคำนวณเป็นแถวแสดงผล/รายงาน (หมวด → หัวข้อ → รายการ → รวม) */
function reportRows(p, r) {
  var out = [], bySec = {};
  r.rows.forEach(function (x) { (bySec[x.section] = bySec[x.section] || []).push(x); });
  p.sections.forEach(function (s, si) {
    var rows = bySec[s.code] || []; if (!rows.length) return;
    var F_ = num(s.factor) || '';
    out.push({ kind: 'SEC', no: String(si + 1), name: s.name, unit: '', qty: '', cost: '', factor: '', mid: '', midPlus: '', adj: '', unitAdj: '' });
    var open = null;
    function flush() { if (open) out.push({ kind: 'SUB', no: '', name: 'รวมค่า' + open.name.replace(/^ค่า/, ''), unit: '', qty: '', cost: open.sub.cost, factor: F_, mid: open.sub.mid, midPlus: open.sub.midPlus, adj: open.sub.adj, unitAdj: '' }); open = null; }
    rows.forEach(function (x) {
      if (x.type === 'H1') { flush(); open = x; out.push({ kind: 'H1', no: x.no || '', name: x.name, unit: '', qty: '', cost: '', factor: '', mid: '', midPlus: '', adj: '', unitAdj: '' }); return; }
      if (x.type === 'H2') { out.push({ kind: 'H2', no: x.no || '', name: x.name, unit: '', qty: '', cost: '', factor: '', mid: '', midPlus: '', adj: '', unitAdj: '' }); return; }
      out.push({ kind: 'ITEM', src: x, special: x.kind === 'special', no: x.no || '', name: x.name, unit: x.unit || '', qty: x.qty, cost: x.cost, factor: x.factor, mid: x.mid, midPlus: x.midPlus, adj: x.adj, unitAdj: x.unitAdj });
    });
    flush();
    var t = r.secTotals[s.code];
    out.push({ kind: 'SECTOT', no: '', name: 'รวม ' + s.name, unit: '', qty: '', cost: t.cost, factor: F_, mid: t.mid, midPlus: t.midPlus, adj: t.adj, unitAdj: '' });
  });
  return out;
}

    reportRows(p, r).map(function (x) {

    }).join('') +
    '<tr><td colspan="' + (mk ? 6 : 6) + '" class="n" style="border:none;border-right:1px solid #333"><b>วงเงินรวม</b></td><td class="n"><b>' + F(r.totalMid) + '</b></td>' + (mk ? '<td class="n"><b>' + F(r.total) + '</b></td>' : '') + '<td class="n shade"><b>' + F(r.sumAdj) + '</b></td><td style="border:none">(*)</td></tr></tbody></table>';
  h += '<div class="note"><u>หมายเหตุ</u> (*) ส่วนต่างนี้ให้ปรับเพิ่มลด ในรายการใดรายการหนึ่งได้ตามความเหมาะสม ยกเว้น รายการค่าใช้จ่ายพิเศษตามข้อกำหนด ทั้งนี้ วงเงินรวมของการปรับลดราคาจะต้องเท่ากับราคาตามคำเสนอของผู้ชนะการจัดซื้อจัดจ้าง' +
    (r.method === 'std' ? '<br>ราคาที่ปรับลดทุกรายการคำนวณด้วยสัดส่วนเดียวกัน (2) ÷ (1) = ' + r.factor.toFixed(8) + ' ราคาต่อหน่วยเป็นสตางค์เต็ม และจำนวน × ราคาต่อหน่วย = ราคา' + (r.unitMismatch.length ? ' ยกเว้นรายการ "' + esc(r.unitMismatch[0].name) + '"' : '')
      : (r.target ? '<br>ส่วนต่างจากการปัดเศษ ' + F(r.residual) + ' บาท ปรับในรายการ "' + esc(r.target.name) + '"' : '')) + '</div>';
  h += signHtml([[st.officerName, st.officerPosition, 'ผู้ปรับลดราคา'], [st.checkerName, st.checkerPosition, 'ผู้ตรวจสอบ']]);
  return h + '</div>';
}

      return '<tr class="k-' + x.kind + '"><td class="c">' + (x.no === '-' ? '' : esc(x.no)) + '</td>' + lab + '<td class="c">' + esc(x.unit) + '</td><td class="n">' + F(x.qty) + '</td><td class="n' + (x.kind === 'SECTOT' ? ' shade' : '') + '">' + F(x.adj) + '</td><td class="n">' + F(x.unitAdj) + '</td></tr>';
    }).join('') +
    '<tr><td colspan="4" class="n" style="border:none;border-right:1px solid #333"><b>วงเงินตามสัญญา</b></td><td class="n shade"><b>' + F(r.sumAdj) + '</b></td><td style="border:none"></td></tr></tbody></table>';

function exportReport(pdf) {
  if (!S.cur.project.id || S.dirty) { toast('กรุณาบันทึกโครงการก่อนส่งออก', 'warning'); return; }
  loading(true);
  api('apiExportReport', S.cur.project.id, pdf).then(function (o) {
    loading(false);
    Swal.fire({ icon: 'success', title: 'ส่งออกเรียบร้อย', confirmButtonColor: '#16603f',
      html: '<a href="' + o.sheetUrl + '" target="_blank" class="btn btn-success m-1"><i class="bi bi-file-earmark-spreadsheet"></i> เปิด Google Sheets</a>' +
        (o.pdfUrl ? '<a href="' + o.pdfUrl + '" target="_blank" class="btn btn-danger m-1"><i class="bi bi-file-earmark-pdf"></i> เปิด PDF</a>' : '') +
        '<a href="' + o.folderUrl + '" target="_blank" class="btn btn-outline-secondary m-1"><i class="bi bi-folder2-open"></i> โฟลเดอร์รายงาน</a>' });
  }).catch(fail);
}

/* ---------------------- Settings ---------------------- */
function renderSettings() {
  $$('#setForm [data-s]').forEach(function (el) { el.value = S.settings[el.getAttribute('data-s')] || ''; });
  var a = $('#dbLink'); if (S.dbUrl) { a.href = S.dbUrl; a.classList.remove('disabled'); } else { a.removeAttribute('href'); a.classList.add('disabled'); }
  $('#verText').textContent = 'เวอร์ชัน ' + (S.version || '');
}
function saveSettings() {
  var o = {}; $$('#setForm [data-s]').forEach(function (el) { o[el.getAttribute('data-s')] = el.value.trim(); });
  loading(true);
  api('apiSaveSettings', o).then(function (s) { S.settings = s; loading(false); toast('บันทึกการตั้งค่าแล้ว'); }).catch(fail);
}

/* ---------------------- Offline data backup (PWA mode) ---------------------- */
function backupLocal() {
  api('apiExportAll').then(function (d) {
    var blob = new Blob([JSON.stringify(d, null, 1)], { type: 'application/json' });
    var a = document.createElement('a'), t = new Date();
    a.href = URL.createObjectURL(blob);
    a.download = 'boq-w651-backup-' + t.getFullYear() + ('0' + (t.getMonth() + 1)).slice(-2) + ('0' + t.getDate()).slice(-2) + '.json';
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('บันทึกไฟล์สำรองแล้ว (' + Object.keys(d.projects).length + ' โครงการ)');
  }).catch(fail);
}
function restoreLocal(e) {
  var f = e.target.files[0]; e.target.value = ''; if (!f) return;
  var rd = new FileReader();
  rd.onload = function () {
    var d; try { d = JSON.parse(rd.result); } catch (err) { fail(new Error('อ่านไฟล์ไม่ได้ — ไฟล์ต้องเป็น .json ที่ได้จากปุ่ม "สำรองข้อมูล"')); return; }
    var n = d && d.projects ? Object.keys(d.projects).length : 0;
    confirmBox('นำเข้าข้อมูลสำรอง?', 'ข้อมูลปัจจุบันในเครื่องนี้จะถูกแทนที่ด้วยไฟล์สำรอง (' + n + ' โครงการ)', true).then(function (ok) {
      if (!ok) return;
      api('apiImportAll', d).then(function (list) { S.projects = list; S.cur = null; S.dirty = false; return api('apiInit'); })
        .then(function (i) { S.settings = i.settings; toast('นำเข้าข้อมูลแล้ว'); showTab('dash'); }).catch(fail);
    });
  };
  rd.readAsText(f);
}
function resetLocal() {
  confirmBox('ล้างโครงการทั้งหมดในเครื่องนี้?', 'ควรสำรองข้อมูลก่อน การล้างนี้ย้อนกลับไม่ได้ (การตั้งค่าผู้ลงนามยังคงอยู่)', true).then(function (ok) {
    if (!ok) return;
    api('apiResetAll').then(function (list) { S.projects = list; S.cur = null; S.dirty = false; toast('ล้างข้อมูลแล้ว'); showTab('dash'); }).catch(fail);
  });
}

/* ---------------------- Install as app (PWA) ---------------------- */
function setupInstall() {
  var btn = $('#btnInstall'); if (!btn || IS_GAS) return;
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  if (standalone || location.protocol === 'file:') return;
  var deferred = null;
  btn.classList.remove('d-none'); // แสดงเสมอ — ถ้าเบราว์เซอร์พร้อมจะเปิดหน้าต่างติดตั้ง ไม่พร้อมจะแสดงวิธีติดตั้ง
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; btn.classList.add('btn-pulse'); });
  window.addEventListener('appinstalled', function () { btn.classList.add('d-none'); toast('ติดตั้งแอปเรียบร้อย เปิดได้จากหน้าจอหลัก/เมนูโปรแกรม'); });
  btn.addEventListener('click', function () {
    if (deferred) { deferred.prompt(); deferred.userChoice.then(function (c) { deferred = null; if (c.outcome === 'accepted') btn.classList.add('d-none'); }); return; }
    var ua = navigator.userAgent;
    var isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var isEdge = /Edg\//.test(ua), isAndroid = /Android/i.test(ua), isFirefox = /Firefox/i.test(ua);
    var isSafariMac = /Safari/.test(ua) && !/Chrome|Chromium|Edg/.test(ua) && !isIOS;
    var html;
    if (isIOS) html = 'เปิดหน้านี้ใน <b>Safari</b> แล้วแตะปุ่ม <b>แชร์</b> <i class="bi bi-box-arrow-up"></i><br>เลือก <b>"เพิ่มไปยังหน้าจอโฮม"</b>';
    else if (isAndroid) html = 'แตะเมนู <b>⋮</b> มุมขวาบนของ Chrome<br>เลือก <b>"ติดตั้งแอป"</b> หรือ <b>"เพิ่มลงในหน้าจอหลัก"</b>';
    else if (isEdge) html = 'คลิกเมนู <b>…</b> มุมขวาบน → <b>แอป</b> → <b>"ติดตั้งไซต์นี้เป็นแอป"</b><br>หรือคลิกไอคอน <i class="bi bi-plus-square"></i> ท้ายช่อง URL';
    else if (isSafariMac) html = 'ที่เมนู <b>ไฟล์ (File)</b> เลือก <b>"เพิ่มไปยัง Dock" (Add to Dock)</b>';
    else if (isFirefox) html = 'Firefox บนคอมพิวเตอร์ยังไม่รองรับการติดตั้งแอป<br>กรุณาเปิดลิงก์นี้ด้วย <b>Chrome</b> หรือ <b>Edge</b>';
    else html = 'คลิกไอคอน <i class="bi bi-display"></i><i class="bi bi-arrow-down-short"></i> <b>ติดตั้ง</b> ท้ายช่อง URL<br>หรือเมนู <b>⋮</b> → <b>"แคสต์ บันทึก และแชร์"</b> → <b>"ติดตั้งหน้าเว็บเป็นแอป..."</b>' +
      '<div class="small text-muted mt-2">ถ้ายังไม่พบ ให้คลิกใช้งานหน้านี้สักครู่ แล้วกดปุ่มนี้อีกครั้ง หรือแอปอาจติดตั้งไว้แล้ว (ดูที่ chrome://apps)</div>';
    Swal.fire({ icon: 'info', title: 'ติดตั้งแอปลงเครื่อง', html: html, confirmButtonText: 'เข้าใจแล้ว', confirmButtonColor: '#16603f' });
  });
}
